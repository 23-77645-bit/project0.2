<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Attendance QR Scanner</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem; }
    .container { max-width: 700px; margin: auto; background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { margin-top: 0; }
    input, button { width: 100%; padding: .7rem; margin-top: .6rem; }
    .status { margin-top: 1rem; padding: .8rem; border-radius: 8px; }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
    .info { background: #dbeafe; color: #1e3a8a; }
  </style>
</head>
<body>
  <div class="container">
    <h1>QR-Based Student Attendance</h1>
    <p>Scan QR code (or paste payload) to record attendance.</p>
    <label for="qrInput">QR Payload</label>
    <input id="qrInput" type="text" placeholder="Paste scanned QR payload here" />
    <button id="submitBtn">Submit Attendance</button>
    <div id="result" class="status info">Awaiting scan...</div>
  </div>

  <script>
    const apiBase = 'http://localhost:5000';
    const resultEl = document.getElementById('result');

    function showMessage(type, message) {
      resultEl.className = `status ${type}`;
      resultEl.textContent = message;
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const qrData = document.getElementById('qrInput').value.trim();
      if (!qrData) {
        showMessage('error', 'Please provide QR payload.');
        return;
      }

      try {
        const res = await fetch(`${apiBase}/api/attendance`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ qr_data: qrData })
        });
        const data = await res.json();

        if (res.ok) {
          showMessage('success', `${data.message} (${data.type || data.status})`);
        } else {
          showMessage('error', data.message || data.error || 'Failed to process attendance.');
        }
      } catch (err) {
        showMessage('error', 'Backend is unreachable. Please try again.');
      }
    });
  </script>
</body>
</html>
