# ============================================================
#  Kubernetes — Backend Deployment + Service
#  🔒 CIA: Confidentiality — secrets from K8s Secret, not plain env
#
#  Before applying, create the secret:
#  kubectl create secret generic attendance-secrets \
#    --from-literal=db-password=YOUR_PASSWORD \
#    --from-literal=db-root-password=YOUR_ROOT_PASSWORD \
#    --from-literal=admin-username=YOUR_ADMIN \
#    --from-literal=admin-password=YOUR_ADMIN_PASSWORD \
#    --from-literal=qr-secret-key=YOUR_QR_SECRET \
#    --from-literal=jwt-secret=YOUR_JWT_SECRET
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-backend
  labels:
    app: attendance-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attendance-backend
  template:
    metadata:
      labels:
        app: attendance-backend
    spec:
      containers:
        - name: backend
          image: yourdockerhub/student-attendance-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: mysql-service
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: attendance_db
            - name: DB_USER
              value: attendance_user
            - name: FRONTEND_ORIGIN
              value: "http://localhost:3000"
            # 🔒 CIA: Confidentiality — all secrets from K8s Secret, never plain text
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: db-password
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: admin-password
            - name: QR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: qr-secret-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: jwt-secret
          # ⚡ CIA: Availability — liveness and readiness probes
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: attendance-backend-service
spec:
  selector:
    app: attendance-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP                  # 🔒 CIA: Confidentiality — internal only, not exposed
